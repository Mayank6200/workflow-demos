name: First workflow
on: push
jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repo
          uses: actions/checkout@v6 
          
        - name: Welcome message
          run: |
            echo "My first github workflow command"
            ls
            cat index.html
            
        - name: Install cowsay
          run: sudo apt install cowsay -y

        - name: Create Dragon
          run: cowsay -f dragon " I am a Dragon and I am breath fire. " >> dragon.txt

        - name: Show dragon
          run: cat dragon.txt
          
